# Decap CMS – https://decapcms.org/docs/configuration-options/
backend:
  name: git-gateway
  branch: main

# Lokal redigering: kör `npm run cms` och `npm run dev`, öppna http://localhost:4321/admin/
local_backend: true

locale: sv
site_url: https://lj-energi-och-komfort.netlify.app
display_url: https://lj-energi-och-komfort.netlify.app
publish_mode: editorial_workflow # lokalt (localhost) används 'simple', se src/pages/admin/index.astro

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: products
    label: Värmepumpar
    label_singular: Värmepump
    folder: src/content/products
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    sortable_fields: [order, title, price]
    summary: "{{title}} – {{type}} – {{price}} kr"
    fields:
      - { name: title, label: Produktnamn, widget: string }
      - { name: brand, label: Märke, widget: string }
      - { name: type, label: Typ, widget: select, options: ["Luft/luft", "Luft/vatten"], default: "Luft/luft" }
      - { name: price, label: "Pris inkl. moms (kr)", widget: number, value_type: int }
      - { name: campaignPrice, label: "Kampanjpris (kr)", widget: number, value_type: int, required: false }
      - { name: image, label: Produktbild, widget: image, required: false }
      - { name: excerpt, label: Kort beskrivning, widget: text }
      - { name: energyClass, label: Energiklass, widget: string, required: false, hint: "t.ex. A+++" }
      - { name: scop, label: SCOP, widget: number, value_type: float, step: 0.1, required: false }
      - { name: heatingCapacity, label: Värmeeffekt, widget: string, required: false, hint: "t.ex. 0,9–6,5 kW" }
      - { name: suitableFor, label: Passar för, widget: string, required: false, hint: "t.ex. Upp till 120 m²" }
      - { name: minOutdoorTemp, label: "Lägsta utetemperatur (°C)", widget: number, value_type: int, required: false }
      - { name: noiseLevel, label: "Ljudnivå inomhus (dB)", widget: number, value_type: int, required: false }
      - { name: features, label: Fördelar, widget: list, field: { name: feature, label: Fördel, widget: string }, required: false }
      - { name: featured, label: Visa på startsidan, widget: boolean, default: false }
      - { name: inStock, label: I lager, widget: boolean, default: true }
      - { name: order, label: Sorteringsordning, widget: number, value_type: int, default: 100, hint: "Lägre nummer visas först" }
      - { name: body, label: Produktbeskrivning, widget: markdown }

  - name: settings
    label: Inställningar
    files:
      - name: site
        label: Företag & startsida
        file: src/data/settings.json
        fields:
          - { name: companyName, label: Företagsnamn, widget: string }
          - { name: tagline, label: Slogan, widget: string }
          - { name: phone, label: Telefon, widget: string }
          - { name: email, label: E-post, widget: string }
          - { name: address, label: Adress, widget: string }
          - { name: orgNumber, label: Organisationsnummer, widget: string }
          - { name: serviceArea, label: Serviceområde, widget: string }
          - name: hero
            label: Startsida – toppsektion
            widget: object
            fields:
              - { name: title, label: Rubrik, widget: string }
              - { name: highlight, label: "Markerad del av rubriken", widget: string, required: false, hint: "Måste finnas ordagrant i rubriken, visas i ljusgrönt" }
              - { name: text, label: Text, widget: text }
              - { name: buttonText, label: Knapptext, widget: string }
          - name: stats
            label: Siffror i toppsektionen
            widget: list
            max: 4
            fields:
              - { name: value, label: Värde, widget: string }
              - { name: label, label: Beskrivning, widget: string }
          - name: usps
            label: Säljargument
            widget: list
            fields:
              - { name: title, label: Rubrik, widget: string }
              - { name: text, label: Text, widget: text }
          - name: faq
            label: Vanliga frågor
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { name: question, label: Fråga, widget: string }
              - { name: answer, label: Svar, widget: text }
